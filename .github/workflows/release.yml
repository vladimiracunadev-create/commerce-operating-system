name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:pack
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/installers/*.exe", if-no-files-found: error }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - run: chmod +x android/gradlew
      - run: ./android/gradlew -p android assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CommerceOS-Demo-Android-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "CommerceOS-Demo-Android-*.apk", if-no-files-found: error }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: release, merge-multiple: true }
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --generate-notes --title "Commerce OS ${{ github.ref_name }}"
