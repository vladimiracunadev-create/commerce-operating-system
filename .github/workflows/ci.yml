name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify project
        run: pnpm check

  compose:
    name: Server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start reference stack
        run: docker compose up --build --detach --wait
      - name: Run end-to-end smoke test
        run: node scripts/smoke-api.mjs
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop reference stack
        if: always()
        run: docker compose down

  windows:
    name: Build Windows portable
    needs: validate
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:pack
      - name: Verify executable
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist/installers/*.exe | Select-Object -First 1
          if (-not $artifact -or $artifact.Length -lt 1MB) { throw "Windows artifact is missing or empty" }
          Write-Output "$($artifact.Name): $($artifact.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: commerce-os-windows
          path: dist/installers/*.exe
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - run: chmod +x android/gradlew
      - run: ./android/gradlew -p android assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: commerce-os-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
