name: Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "apps/web/**"
      - "packages/demo-core/index.js"
      - "docs/assets/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar producto en GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar sitio autocontenido
        run: |
          mkdir -p .pages/assets .pages/demo
          cp -R landing/. .pages/
          cp docs/assets/screenshots/demo-conceptual-overview.png .pages/assets/
          cp docs/assets/screenshots/demo-conceptual-flow.png .pages/assets/
          cp -R apps/web/. .pages/demo/
          cp packages/demo-core/index.js .pages/demo/demo-core.js

      - name: Verificar sitio y demo
        run: |
          test -s .pages/index.html
          test -s .pages/styles.css
          test -s .pages/assets/demo-conceptual-overview.png
          test -s .pages/assets/demo-conceptual-flow.png
          test -s .pages/demo/index.html
          if grep -rInE '<(script|img|iframe|source|video|audio|embed|object)[^>]+(src|data)="https?://' .pages/; then
            echo "Recurso externo ejecutable detectado."
            exit 1
          fi
          if grep -rInE '<link[^>]+href="https?://' .pages/; then
            echo "Hoja de estilos o fuente remota detectada."
            exit 1
          fi
          if grep -rInE 'googletagmanager|google-analytics|hotjar|segment\.io|plausible\.io|matomo' .pages/; then
            echo "Analítica detectada."
            exit 1
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
