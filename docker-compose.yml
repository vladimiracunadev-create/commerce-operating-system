services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports: ["5432:5432"]
    volumes:
      - commerce_db:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://commerce:commerce@db:5432/commerce
      AGENTS_URL: http://agents:8100
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
      agents:
        condition: service_started

  agents:
    build: ./services/agents
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["8100:8100"]

volumes:
  commerce_db:
